services:
  - type: web
    name: nabaa-backend
    env: node
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nabaa-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false

databases:
  - name: nabaa-db
    databaseName: nabaa_store
    user: postgres
    plan: free
